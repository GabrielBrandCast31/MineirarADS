# ============================================================================
# Gateway do Supabase local.
#
# O supabase-js espera um único host que sirva /auth/v1, /rest/v1 e
# /storage/v1. No Supabase hospedado quem faz isso é o Kong; aqui um nginx
# resolve o mesmo em três `location`, sem configuração declarativa nem
# substituição de variáveis no boot.
#
# Realtime não é roteado de propósito: a aplicação não abre canal nenhum.
# ============================================================================

events {
  worker_connections 1024;
}

http {
  # Sobe o limite para as políticas de bucket de 0010 (criativos de até 50MB).
  client_max_body_size 64m;

  server {
    listen 8000;
    server_name _;

    # O resolver do Docker, consultado em tempo de requisição: passar o
    # upstream por variável evita que o nginx morra no boot só porque o
    # GoTrue ainda não subiu.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/auth/v1/(.*) {
      set $upstream_auth http://auth:9999;
      proxy_pass $upstream_auth/$1$is_args$args;
    }

    location ~ ^/rest/v1/(.*) {
      set $upstream_rest http://rest:3000;
      proxy_pass $upstream_rest/$1$is_args$args;
    }

    location ~ ^/storage/v1/(.*) {
      set $upstream_storage http://storage:5000;
      proxy_pass $upstream_storage/$1$is_args$args;
    }

    location = /health {
      access_log off;
      return 200 "ok\n";
    }
  }
}
